name: LetterLens
options:
  bundleIdPrefix: app.letterlens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  LetterLensCore:
    path: Packages/LetterLensCore
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  LetterLens:
    type: application
    platform: iOS
    sources:
      - path: LetterLens
    dependencies:
      - package: LetterLensCore
    info:
      path: LetterLens/Info.plist
      properties:
        CFBundleDisplayName: LetterLens
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
