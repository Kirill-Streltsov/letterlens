name: LetterLens
options:
  bundleIdPrefix: app.letterlens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  LetterLensCore:
    path: Packages/LetterLensCore
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  LetterLens:
    type: application
    platform: iOS
    sources:
      - path: LetterLens
    dependencies:
      - package: LetterLensCore
    info:
      path: LetterLens/Info.plist
      properties:
        CFBundleDisplayName: LetterLens
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "LetterLens uses the camera to scan your letter. The text is read on your device."
        NSCalendarsWriteOnlyAccessUsageDescription: "LetterLens adds deadlines from your letters to your calendar."
        CFBundleURLTypes:
          - CFBundleURLName: app.letterlens.auth
            CFBundleURLSchemes: [letterlens]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LLApiBaseURL: $(LL_API_BASE_URL)
        LLAuthDomain: $(LL_AUTH_DOMAIN)
        LLClientId: $(LL_CLIENT_ID)
        LLDevUser: $(LL_DEV_USER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.letterlens.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  LetterLens:
    build:
      targets:
        LetterLens: all
    run:
      config: Debug
      storeKitConfiguration: LetterLens/Resources/LetterLens.storekit
    archive:
      config: Release
