[project]
name = "letterlens-infra"
version = "0.1.0"
description = "AWS CDK app for LetterLens"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-cdk-lib>=2.200",
    "constructs>=10.4",
    "cdk-nag>=2.30,<3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
