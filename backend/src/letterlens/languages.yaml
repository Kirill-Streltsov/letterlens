# Output languages. The evaluation job (evals/run.py --update-languages) sets
# "status" and "faithfulness" from the latest measured scores.
# enabled:      faithfulness >= threshold in evals/thresholds.yaml
# experimental: not yet measured, or below threshold; the client shows a warning
# disabled:     not offered
languages:
  en: {name: English, native_name: English, status: enabled, faithfulness: null}
  de: {name: Plain German, native_name: Einfaches Deutsch, status: enabled, faithfulness: null}
  tr: {name: Turkish, native_name: Türkçe, status: experimental, faithfulness: null}
  ar: {name: Arabic, native_name: العربية, rtl: true, status: experimental, faithfulness: null}
  uk: {name: Ukrainian, native_name: Українська, status: experimental, faithfulness: null}
  ru: {name: Russian, native_name: Русский, status: experimental, faithfulness: null}
