[project]
name = "letterlens"
version = "0.1.0"
description = "LetterLens backend: explains German official letters in the reader's language, with grounded deadlines."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "mangum>=0.19",
    "pyyaml>=6.0",
    "anthropic>=0.70",
    "stripe>=11",
]

[project.optional-dependencies]
# boto3 is part of the AWS Lambda Python runtime, so it is not bundled.
aws = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "boto3>=1.35",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "uvicorn>=0.32",
    "hypothesis>=6.120",
]
# Training-only dependencies. They never ship in the Lambda bundle.
train = [
    "scikit-learn>=1.5",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letterlens"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a PostgreSQL database (LETTERLENS_TEST_DATABASE_URL)",
    "live: calls a real LLM provider (costs quota)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "S101",    # assert is fine in tests
    "PLR0913", # many arguments are fine for builders
    "PLR2004", # magic values are fine in tests and parsers
    "RUF001", "RUF002", "RUF003", # German and Arabic text is intentional
    "PLC0415", # local imports keep Lambda cold starts small
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "N802"]
"evals/**" = ["S311", "T201", "PLR0915", "PLR0912"]
"scripts/**" = ["T201", "S311"]
"src/letterlens/synthetic/**" = ["S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*", "scripts.*"]
disallow_untyped_defs = false
